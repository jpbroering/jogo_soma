<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta charset="UTF-8">
        <link rel="stylesheet" href="styles.css">
        <script type="module" src="modulos/controller/indexController.mjs"></script>
        <title>Aritmética — Início</title>
    </head>

    <body>
        <main>
            <section id="tela-config" aria-labelledby="titulo-config">
                <h1 id="titulo-config">Jogo de aritmética</h1>

                <form id="form-config">
                    <div class="campo-form">
                        <label class="texto-form" for="nvl-config">Nível</label>
                        <select name="nivel" class="input-form" id="nvl-config" required>
                            <option selected value="0">Nível 1</option>
                            <option value="1">Nível 2</option>
                            <option value="2">Nível 3</option>
                            <option value="3">Nível 4</option>
                            <option value="4">Nível 5</option>
                            <option value="5">Nível 6</option>
                            <option value="6">Nível 7</option>
                        </select>
                    </div>

                    <div class="campo-form">
                        <label class="texto-form" for="rdd-config">Rodadas por nível</label>
                        <input
                            type="number"
                            inputmode="numeric"
                            min="1"
                            max="15"
                            value="5"
                            name="rodadas"
                            class="input-form"
                            id="rdd-config"
                            required
                        >
                    </div>

                    <button type="submit" id="envia-form">Iniciar partida</button>
                </form>

                <nav class="nav-principal" aria-label="Outras telas">
                    <a href="estatisticas.html" id="link-estatisticas" class="botao-secundario">Ver estatísticas</a>
                </nav>
            </section>
        </main>
    </body>
</html>
