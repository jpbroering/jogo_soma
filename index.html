<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Aritmetica</title>
        <link rel="stylesheet" href="styles.css">
    </head>

    <body>
        <main>
            <div id="telaConfig">
                <h1 id="tituloConfig">Jogo de aritmética</h1>
                <form id="formConfig" action="javascript: defineConfig()">
                    <span class="textoForm">Nível</span> <br>
                    <select name="nivel" class="inputForm" id="nvlConfig">
                        <option selected value="0" >Nível 1</option>
                        <option value="1" >Nível 2</option>
                        <option value="2" >Nível 3</option>
                        <option value="3" >Nível 4</option>
                        <option value="4" >Nível 5</option>
                        <option value="5" >Nível 6</option>
                        <option value="6" >Nível 7</option>
                    </select> <br>
                    <span class="textoForm">Rodadas por nível</span> <br>
                    <input type="number" min="1" max="15" value="5" name="rodadas" class="inputForm" id="rddConfig"> <br>
                    <input type="submit" value="Iniciar" id="enviaForm">
                </form>
            </div>
            <div class="impedeSelect" id="tela">
                <header id="barraInfo">
                    <div id="infoJogo">
                        <span class="textoInfo" id="infoNivel"></span>
                        <span class="textoInfo" id="infoRodada"></span>
                    </div>
                    <button id="botaoVoltar">

                    </button>
                </header>

                <div id="telaJogo">

                    <div id="telaEquacao" >
                        <ul id="lista_equacao">

                        </ul>
                    </div>

                    <div id="telaOpcoes">
                        <ul id="lista_opcoes">

                        </ul>
                    </div>

                    <div id="telaBotoes">
                        <button id="botaoEnviar">Enviar Resposta</button>
                    </div>
                </div>
            </div>
        </main>
        <div id="dialogoResultado" class="dialogo-resultado" role="status" aria-live="polite" aria-atomic="true"></div>
        <template>
            <svg width="70" height="70" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="formato-bola">
                        <circle cx="50" cy="50" r="48" />
                    </clipPath>
                    <radialGradient id="efeito-3d" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.8" />
                        <stop offset="40%" stop-color="white" stop-opacity="0" />
                        <stop offset="100%" stop-color="black" stop-opacity="0.5" />
                    </radialGradient>
                </defs>

                <circle cx="50" cy="50" r="48" fill="#F4F4F4" />
                <rect x="0" y="0" width="100" height="0" fill="#000000" clip-path="url(#formato-bola)" />
                <circle cx="50" cy="50" r="22" fill="#FFFFFF" />
                <text x="50" y="59" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#000000">n</text>
                <circle cx="50" cy="50" r="48" fill="url(#efeito-3d)" stroke="#333" stroke-width="1.5" />
            </svg>
        </template>
        <script src="script.js"></script>
    </body>
</html>
