<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta name="viewport" content="width=device-width"/>
        <title>Aritmetica</title>

        <style>
            body {
                margin: 0;
                min-height: 100vh;
            }

            ul {
                display: flex;
                list-style: none;
                padding: 0px;

            }

            #telaJogo {
                display: flex;
                flex-direction: column;
                justify-content: space-evenly;
                align-items: center;
                min-height: 100vh;
            }

            #telaEquacao {
                display: flex;
                justify-content: space-around;
                align-items: center;

                padding: 10px;

            }

            .texto_equacao {
                font-size: 48px;
            }
            .bola svg {
                width: 100%;
                height: 100%;
                pointer-events: none;
            }

            .bola:hover {
                transform: scale(1.1);
            }

            .bola.selected {
                transform: scale(1.15);
                filter: drop-shadow(0px 0px 12px #facc15);
            }

            .espaco {
                display: flex;
                margin-left: 5px;
                margin-right: 5px;
                min-width: 80px;
                min-height: 80px;
                justify-content: center;
                align-items: center;
            }

            .espaco.vazio {
                border: 5px dashed black;
                border-radius: 50%;
            }

            .espaco_texto {
                display: flex;
                min-width: 40px;
                min-height: 80px;
                justify-content: center;
                align-items: center;
            }

            #telaOpcoes {
                display: flex;
                justify-content: space-evenly;
                align-items: center;
                
                
                padding: 15px;
                background-color: cornflowerblue;
                border-radius: 25px;
            }

            #telaBotoes {
                padding: 10px;
            }

            #botaoEnviar {
                min-width: 200px;
                min-height: 50px;

                font-size: large;
            }
        </style>
    </head>

    <body>
        <div id="telaJogo">

            <div id="telaEquacao" >
                <ul id="lista_equacao">

                </ul>
            </div>

            <div id="telaOpcoes">
                <ul id="lista_opcoes">

                </ul>
            </div>

            <div id="telaBotoes">
                <button id="botaoEnviar" onclick="onClickSend()">Enviar</button>
            </div>
        </div>
        <script>
            // Conjunto das bolas de bilhar
            const CONJ = {
                menores: [1, 2, 3, 4, 5],
                meio: [6, 7, 8, 9, 10],
                maiores: [11, 12, 13, 14, 15]
            };

            const NIVEIS = [
                {
                    equacao: [[CONJ.menores, "+", CONJ.meio]],
                    resultado_positivo: true
                },
                {
                    equacao: [[CONJ.meio, "-", CONJ.menores]],
                    resultado_positivo: true
                },
                {
                    equacao: [[CONJ.menores, "+", CONJ.meio], [CONJ.meio, "+", CONJ.meio],
                              [CONJ.meio, "-", CONJ.menores], [CONJ.maiores, "-", CONJ.meio]],
                    resultado_positivo: true
                },
                {
                    equacao: [[CONJ.maiores, "-", CONJ.meio, "-", CONJ.menores]],
                    resultado_positivo: true
                },
                {
                    equacao: [[CONJ.maiores, "-", CONJ.maiores, "-", CONJ.maiores]],
                    resultado_positivo: false
                },
            ];
            
            // TODO: Ver sobre Sets para melhorar performance
            // Retorna um index aleatorio de um array que não esteja ou não no filtro
            function randomIndex(arr, filtro=[], inverterFiltro=false) {
                if (filtro.length == 0) {
                    return Math.floor(Math.random() * arr.length);
                }

                let filtrado = [];
                
                arr.forEach((el, i) => {
                    let contem = filtro.includes(el);

                    if (inverterFiltro && contem) {
                        filtrado.push(i);
                    } 
                    else if (!inverterFiltro && !contem) {
                        filtrado.push(i);
                    }
                });

                let index = filtrado[Math.floor(Math.random() * filtrado.length)];
                return index;
            }

            // Retorna um item aleatorio de um array que não esteja ou não no filtro
            function randomItem(arr, filtro=[], inverterFiltro=false) {
                return arr[randomIndex(arr, filtro, inverterFiltro)];
            }

            // Dicionário com as cores base de 1 a 8, o conjunto de 9 a 15 reutiliza as cores do 1 a 7
            const coresBilhar = {
                1: '#FFCC00', 2: '#0055CC', 3: '#CC0000', 4: '#4B0082',
                5: '#FF6600', 6: '#008033', 7: '#800000', 8: '#222222'
            };

            // TODO: Autoajustar tamanho do svg com base na tela
            function gerarSvgBola(numero) {
                // Descobre a cor base (se for maior que 8, subtrai 8 para pegar a mesma cor)
                let cor = coresBilhar[numero > 8 ? numero - 8 : numero]; 
                
                // Se for maior que 8, é listrada (altura 56, Y 22). Se for menor ou igual, é lisa (altura 100, Y 0)
                let isListrada = numero > 8;
                let rectY = isListrada ? "22" : "0";
                let rectHeight = isListrada ? "56" : "100";

                return `
                <svg width="70" height="70" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <clipPath id="formato-bola-${numero}">
                            <circle cx="50" cy="50" r="48" />
                        </clipPath>
                        <radialGradient id="efeito-3d-${numero}" cx="30%" cy="30%" r="70%">
                            <stop offset="0%" stop-color="white" stop-opacity="0.8" />
                            <stop offset="40%" stop-color="white" stop-opacity="0" />
                            <stop offset="100%" stop-color="black" stop-opacity="0.5" />
                        </radialGradient>
                    </defs>

                    <circle cx="50" cy="50" r="48" fill="#F4F4F4" />
                    <rect x="0" y="${rectY}" width="100" height="${rectHeight}" fill="${cor}" clip-path="url(#formato-bola-${numero})" />
                    <circle cx="50" cy="50" r="22" fill="#FFFFFF" />
                    <text x="50" y="59" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#000000">${numero}</text>
                    <circle cx="50" cy="50" r="48" fill="url(#efeito-3d-${numero})" stroke="#333" stroke-width="1.5" />
                </svg>`;
            }
            
            // TODO: Refatorar esse codigo
            function onClickOption(li) {          
                if (li.classList.contains('vazio') && li.hasChildNodes()) {
                    document.getElementById(li.firstChild.getAttribute('data-value')).appendChild(li.firstChild);
                    li.removeChild(li.firstChild);
                    li.firstChild.classList.remove('selected');

                }
                else if (li.classList.contains('vazio') && !li.hasChildNodes() && estado.bola_selecionada) {
                    estado.bola_selecionada.parentElement.removeChild(estado.bola_selecionada);
                    li.appendChild(estado.bola_selecionada);
                    estado.bola_selecionada.classList.remove('selected');
                    estado.bola_selecionada = null;
                }
                else if (li.hasChildNodes() && li.firstChild.classList.contains('bola')) {
                    if (li.firstChild.classList.contains('selected')) {
                        li.firstChild.classList.remove('selected');
                        estado.bola_selecionada = null;
                        return;
                    }
                    else if (estado.bola_selecionada) {
                        estado.bola_selecionada.classList.remove('selected');
                    }
                    
                    li.firstChild.classList.add('selected');
                    estado.bola_selecionada = li.firstChild;
                }
            }

            function onClickSend() {
                let espacos = document.getElementsByClassName('espaco vazio');
                let i = 0;
                let res = 0, op = "+";
                let eq = estado.rodada.equacao;

                for(el in eq) {
                    switch (eq[el]) {
                        case "+":
                            op = "+";
                            continue;
                        case "-":
                            op = "-";
                            continue;
                    }
                    let num = eq[el];
                    if (eq[el] == null) {
                        if (espacos[i].hasChildNodes()) {
                            num = parseInt(espacos[i].firstChild.getAttribute('data-value'));
                            i++;
                        }
                        else {
                            return alert("Complete a equação antes de enviar");
                        }
                    }
                    
                    if (op == "+") {
                        res += num;
                    }
                    else {
                        res -= num;
                    }
                }

                if (res == estado.rodada.resultado) {
                    estado.nivel_atual += estado.nivel_atual < NIVEIS.length - 1 ? 1 : 0;
                    alert('Acertou');
                    init();
                }
                else {
                    alert('Errou');
                }
            }

            function preencherOpcoes(opcoes) {
                // Limpa elementos existentes na area de opções
                let listaOpcoes = document.getElementById('lista_opcoes');
                if (listaOpcoes.hasChildNodes()) {
                    listaOpcoes.innerHTML = '';
                }
                
                let parser = new DOMParser()
                // TODO: tratar exceções como número inexistente
                opcoes.forEach(bola => {
                    let li = document.createElement('li');
                    let svg = parser.parseFromString(gerarSvgBola(bola), 'text/html').body.firstChild;
                    svg.classList.add('bola');
                    svg.setAttribute('data-value', bola)
                    
                    li.id = bola;
                    li.classList.add('espaco');
                    li.appendChild(svg);

                    listaOpcoes.appendChild(li);
                });
            }
            
            function preencherEquacao(equacao, result) {
                let listaEquacao = document.getElementById('lista_equacao');
                if (listaEquacao.hasChildNodes()) {
                    listaEquacao.innerHTML = '';
                }

                let li, inner;
                
                // TODO: refatorar
                equacao.map((elemento, index) => {
                    li = document.createElement('li');
                    inner = '';

                    if (typeof(elemento) === 'number') {
                        li.classList.add('espaco');
                        inner = gerarSvgBola(elemento);
                    }
                    else if (elemento != null) {
                        li.classList.add('espaco_texto');
                        inner = `<span class='texto_equacao'>${elemento}</span>`;
                    }
                    else if (elemento == null) {
                        li.classList.add('espaco', 'vazio');
                    }
                    li.innerHTML = inner;
                    listaEquacao.appendChild(li);
                })
                
                li = document.createElement('li');
                li.classList.add('espaco_texto');
                li.innerHTML = "<span class='texto_equacao'>=</span>";
                listaEquacao.appendChild(li);

                li = document.createElement('li');
                li.classList.add('espaco_texto');
                li.innerHTML = `<span class='texto_equacao'>${result}</span>`;
                listaEquacao.appendChild(li);
            }

            function gerarEquacao(nivel) {
                let sequencia = [...CONJ.menores, ...CONJ.meio, ...CONJ.maiores];
                let equacao;
                let result = 0;
                let nums = [];
                do {
                    nums = [];
                    equacao = [...randomItem(nivel.equacao)];
                    for (let i = 0, max = equacao.length; i < max + 1; i++) {
                        if (i % 2 == 0) {
                            let num = randomItem(equacao[i], nums);
                            
                            if (i > 0) {
                                switch (equacao[i-1]) {
                                    case "+":
                                        result += num;
                                        break;
                                    case "-":
                                        result -= num;
                                        break;
                                }
                            } else {
                                result += num;
                            }
                            nums.push(num);
                            sequencia.splice(sequencia.indexOf(num),1);
                            equacao.splice(i,1,num);
                        }
                    }
                } while (nivel.resultado_positivo && result < 0)


                // Para ter pelo menos 1 valor na equação
                let faltando = Math.floor(Math.random() * (nums.length - 1)) + 1;

                while (sequencia.length > 7 - faltando) {
                    sequencia.splice(randomIndex(sequencia), 1);
                }

                for (let i = 0; i < faltando; i++) {
                    let item = randomIndex(equacao, nums, true);
                    sequencia.push(...equacao.splice(item, 1, null));
                }

                return {equacao: equacao, resultado: result, sequencia: sequencia};
            }

            let estado = {
                bola_selecionada: null,
                nivel_atual: 0,
                rodada: null
            }

            function init() {
                estado.rodada = gerarEquacao(NIVEIS[estado.nivel_atual])

                preencherEquacao(estado.rodada.equacao, estado.rodada.resultado);
                preencherOpcoes(estado.rodada.sequencia);
            }

            // Adiciona eventos de click
            let listaEquacao = document.getElementById('lista_equacao');
            listaEquacao.addEventListener('click', (event)=>{
                    const opt = event.target.closest('li');
                    if (!opt || !opt.classList.contains('vazio')) {
                        return;
                    }
                    
                    if (!opt.firstChild) {
                        onClickOption(opt)
                    }
                    else if (opt.firstChild.classList.contains("bola")) {
                        onClickOption(opt)
                    }
                });

            let listaOpcoes = document.getElementById('lista_opcoes');
            listaOpcoes.addEventListener('click', (event) => {
                const opt = event.target.closest('li');

                if (opt && opt.firstChild) {
                    onClickOption(opt)
                }
            });

            init();
        </script>
    </body>
</html>
