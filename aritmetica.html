<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Jogo de Soma e Subtração</title>
    <style>
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            background-color: #ED6A22; /* Laranja baseado na imagem */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            user-select: none;
        }

        #header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            box-sizing: border-box;
            background-color: rgba(0,0,0,0.2);
            font-size: 24px;
            font-weight: bold;
        }

        #configModal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            color: black;
            padding: 30px;
            border-radius: 10px;
            width: 400px;
            font-size: 18px;
        }

        #gameArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        #telaEquacao {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 60px;
            flex-wrap: wrap;
        }

        .texto_equacao {
            font-size: 80px;
            font-weight: bold;
        }

        .espaco_vazio {
            width: 100px;
            height: 100px;
            border: 6px dashed white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: border-color 0.2s;
        }
        .espaco_vazio:hover {
            border-color: #FFCC00;
        }

        #telaOpcoes {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            max-width: 900px;
            background-color: rgba(0,0,0,0.1);
            padding: 30px;
            border-radius: 20px;
        }

        .bola {
            cursor: pointer;
            transition: transform 0.2s;
            width: 100px;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .bola:hover {
            transform: scale(1.1);
        }
        .bola.selected {
            transform: scale(1.2);
            filter: drop-shadow(0px 0px 15px yellow);
        }
        
        .bola svg {
            width: 100%;
            height: 100%;
            pointer-events: none; /* Previne erros no drag and drop com elementos internos */
        }

        #feedback {
            margin-top: 30px;
            font-size: 30px;
            font-weight: bold;
            height: 40px;
        }

        button {
            padding: 10px 20px;
            font-size: 20px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            background-color: white;
            color: #ED6A22;
            font-weight: bold;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #f0f0f0;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="header">
        <div style="display:flex; gap: 30px;">
            <span id="nivelDisplay">Nível: 1</span>
            <span id="progressoDisplay">Equações: 0/5</span>
            <span id="timerDisplay" class="hidden">Tempo: 0s</span>
        </div>
        <button onclick="abrirConfigs()">⚙️ Configurações</button>
    </div>

    <div id="gameArea">
        <div id="telaEquacao"></div>
        <div id="telaOpcoes"></div>
        <div id="feedback"></div>
    </div>

    <div id="configModal">
        <div class="modal-content">
            <h2 style="margin-top: 0;">Configurações Extras</h2>
            <label style="display: block; margin-bottom: 15px; cursor: pointer;">
                <input type="checkbox" id="configTimer" style="transform: scale(1.5); margin-right: 10px;"> Ativar temporizador
            </label>
            <label style="display: block; margin-bottom: 30px;">
                Equações por nível:
                <input type="number" id="configQtd" value="5" min="1" max="20" style="width: 60px; font-size: 18px; padding: 5px;">
            </label>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button onclick="fecharConfigs()" style="background-color: #ccc; color: black;">Cancelar</button>
                <button onclick="salvarConfigs()">Salvar e Reiniciar</button>
            </div>
        </div>
    </div>

    <script>
        const bolas = {
            menores: [1, 2, 3, 4, 5],
            meio: [6, 7, 8, 9, 10],
            maiores: [11, 12, 13, 14, 15]
        };

        const poolTodas = [...bolas.menores, ...bolas.meio, ...bolas.maiores];

        const coresBilhar = {
            1: '#FFCC00', 2: '#0055CC', 3: '#CC0000', 4: '#4B0082',
            5: '#FF6600', 6: '#008033', 7: '#800000', 8: '#222222'
        };

        let estadoJogo = {
            nivel: 1,
            resolvidas: 0,
            configs: {
                qtdPorNivel: 5,
                timerAtivo: false
            },
            timer: 0,
            intervalTimer: null,
            equacao: null,
            opcoes: [],
            slots: [], 
            bolaSelecionada: null
        };

        function sample(arr, count) {
            let res = [];
            let temp = [...arr];
            for(let i = 0; i < count; i++) {
                if (temp.length === 0) break;
                let idx = Math.floor(Math.random() * temp.length);
                res.push(temp.splice(idx, 1)[0]);
            }
            return res;
        }

        function gerarSvgBola(numero) {
            let cor = coresBilhar[numero > 8 ? numero - 8 : numero]; 
            let isListrada = numero > 8;
            let rectY = isListrada ? "22" : "0";
            let rectHeight = isListrada ? "56" : "100";

            return `
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="formato-bola-${numero}">
                        <circle cx="50" cy="50" r="48" />
                    </clipPath>
                    <radialGradient id="efeito-3d-${numero}" cx="30%" cy="30%" r="70%">
                        <stop offset="0%" stop-color="white" stop-opacity="0.8" />
                        <stop offset="40%" stop-color="white" stop-opacity="0" />
                        <stop offset="100%" stop-color="black" stop-opacity="0.5" />
                    </radialGradient>
                </defs>
                <circle cx="50" cy="50" r="48" fill="#F4F4F4" />
                <rect x="0" y="${rectY}" width="100" height="${rectHeight}" fill="${cor}" clip-path="url(#formato-bola-${numero})" />
                <circle cx="50" cy="50" r="22" fill="#FFFFFF" />
                <text x="50" y="59" font-family="Arial, sans-serif" font-size="26" font-weight="bold" text-anchor="middle" fill="#000000">${numero}</text>
                <circle cx="50" cy="50" r="48" fill="url(#efeito-3d-${numero})" stroke="#333" stroke-width="1.5" />
            </svg>`;
        }

        function gerarEquacao(nivel) {
            let numsEq = [];
            let operadores = [];
            let result = -1;
            let max_tries = 100;
            
            while (max_tries > 0) {
                if (nivel === 1) {
                    numsEq = sample([...bolas.menores, ...bolas.meio], 2);
                    operadores = ['+'];
                } else if (nivel === 2) {
                    numsEq = [sample(bolas.meio, 1)[0], sample(bolas.menores, 1)[0]];
                    operadores = ['-'];
                } else if (nivel === 3) {
                    if (Math.random() < 0.5) {
                        if (Math.random() < 0.5) {
                            numsEq = [sample(bolas.menores, 1)[0], sample(bolas.meio, 1)[0]];
                            if (Math.random() < 0.5) numsEq.reverse();
                        } else {
                            numsEq = sample(bolas.meio, 2);
                        }
                        operadores = ['+'];
                    } else {
                        if (Math.random() < 0.5) {
                            numsEq = [sample(bolas.meio, 1)[0], sample(bolas.menores, 1)[0]];
                        } else {
                            numsEq = [sample(bolas.maiores, 1)[0], sample(bolas.menores, 1)[0]];
                        }
                        operadores = ['-'];
                    }
                } else if (nivel === 4) {
                    operadores = [Math.random() < 0.5 ? '+' : '-'];
                    numsEq = sample(poolTodas, 2);
                    if (operadores[0] === '-' && numsEq[0] < numsEq[1]) numsEq.reverse();
                } else if (nivel === 5) {
                    if (Math.random() < 0.5) {
                        numsEq = sample([...bolas.menores, ...bolas.meio], 3);
                        operadores = ['+', '+'];
                    } else {
                        numsEq = sample(poolTodas, 2);
                        if (numsEq[0] < numsEq[1]) numsEq.reverse();
                        operadores = ['-'];
                    }
                } else if (nivel === 6) {
                    if (Math.random() < 0.5) {
                        numsEq = sample(poolTodas, 3);
                        operadores = ['+', '+'];
                    } else {
                        numsEq = sample(poolTodas, 3);
                        numsEq.sort((a,b) => b - a); 
                        operadores = ['-', '-'];
                    }
                } else {
                    operadores = Math.random() < 0.5 ? ['+', '-'] : ['-', '+'];
                    numsEq = sample(poolTodas, 3);
                }
                
                result = numsEq[0];
                for(let i=0; i<operadores.length; i++) {
                    if (operadores[i] === '+') result += numsEq[i+1];
                    else result -= numsEq[i+1];
                }
                
                if (result >= 0) break; 
                max_tries--;
            }
            
            // Fallback caso a aleatoriedade falhe todas as 100 vezes (muito improvável)
            if (result < 0) {
                numsEq = [10, 5];
                operadores = ['-'];
                result = 5;
            }
            
            let numEspacos = 1;
            if (nivel >= 4 && numsEq.length > 2 && Math.random() > 0.5) {
                numEspacos = 2; // Maior dificuldade, 2 espaços vazios
            }
            
            let indicesVazios = sample(Array.from(numsEq.keys()), numEspacos);
            
            let opcoes = [...numsEq];
            let disponiveis = poolTodas.filter(x => !opcoes.includes(x));
            let extras = sample(disponiveis, 7 - opcoes.length);
            opcoes = [...opcoes, ...extras];
            opcoes.sort(() => Math.random() - 0.5); 
            
            let format = [];
            let emptySlotsCount = 0;
            
            for(let i=0; i<numsEq.length; i++) {
                if (indicesVazios.includes(i)) {
                    format.push({ type: 'empty', slotIndex: emptySlotsCount });
                    emptySlotsCount++;
                } else {
                    format.push({ type: 'number', value: numsEq[i] });
                }
                if (i < operadores.length) {
                    format.push({ type: 'operator', value: operadores[i] });
                }
            }
            format.push({ type: 'operator', value: '=' });
            format.push({ type: 'result', value: result });
            
            return { format, opcoes, result };
        }

        function iniciarEquacao() {
            let equacao = gerarEquacao(estadoJogo.nivel);
            estadoJogo.equacao = equacao;
            estadoJogo.opcoes = equacao.opcoes;
            
            let numEmpty = equacao.format.filter(x => x.type === 'empty').length;
            estadoJogo.slots = new Array(numEmpty).fill(null);
            estadoJogo.bolaSelecionada = null;
            
            atualizarPlacar();
            renderJogo();
        }

        function atualizarPlacar() {
            document.getElementById('nivelDisplay').textContent = "Nível: " + estadoJogo.nivel;
            document.getElementById('progressoDisplay').textContent = "Equações: " + estadoJogo.resolvidas + "/" + estadoJogo.configs.qtdPorNivel;
        }

        function renderJogo() {
            const telaEquacao = document.getElementById('telaEquacao');
            telaEquacao.innerHTML = '';
            
            estadoJogo.equacao.format.forEach(item => {
                if (item.type === 'operator' || item.type === 'result') {
                    let div = document.createElement('div');
                    div.className = 'texto_equacao';
                    div.textContent = item.value;
                    telaEquacao.appendChild(div);
                } else if (item.type === 'number') {
                    let div = document.createElement('div');
                    div.className = 'bola';
                    div.innerHTML = gerarSvgBola(item.value);
                    telaEquacao.appendChild(div);
                } else if (item.type === 'empty') {
                    let div = document.createElement('div');
                    let idx = item.slotIndex;
                    let val = estadoJogo.slots[idx];
                    
                    if (val !== null) {
                        div.className = 'bola';
                        div.innerHTML = gerarSvgBola(val);
                        div.onclick = () => removerBola(idx);
                        div.title = "Clique para remover";
                    } else {
                        div.className = 'espaco_vazio';
                        if (estadoJogo.bolaSelecionada !== null) {
                            div.classList.add('selected');
                        }
                        div.ondrop = (ev) => drop(ev, idx);
                        div.ondragover = (ev) => allowDrop(ev);
                        div.onclick = () => cliqueEspaco(idx);
                    }
                    telaEquacao.appendChild(div);
                }
            });
            
            const telaOpcoes = document.getElementById('telaOpcoes');
            telaOpcoes.innerHTML = '';
            
            estadoJogo.opcoes.forEach(val => {
                if (!estadoJogo.slots.includes(val)) {
                    let div = document.createElement('div');
                    div.className = 'bola';
                    if (estadoJogo.bolaSelecionada === val) {
                        div.classList.add('selected');
                    }
                    div.innerHTML = gerarSvgBola(val);
                    div.draggable = true;
                    div.ondragstart = (ev) => dragStart(ev, val);
                    div.onclick = () => cliqueOpcao(val);
                    telaOpcoes.appendChild(div);
                }
            });
        }

        function dragStart(ev, val) {
            ev.dataTransfer.setData("valor", val);
            estadoJogo.bolaSelecionada = null; // reseta seleção por clique se começar a arrastar
            renderJogo();
        }

        function allowDrop(ev) {
            ev.preventDefault();
        }

        function drop(ev, idx) {
            ev.preventDefault();
            let val = parseInt(ev.dataTransfer.getData("valor"));
            if (!isNaN(val)) {
                estadoJogo.slots[idx] = val;
                verificarResposta();
            }
        }

        function cliqueOpcao(val) {
            if (estadoJogo.bolaSelecionada === val) {
                estadoJogo.bolaSelecionada = null;
            } else {
                estadoJogo.bolaSelecionada = val;
            }
            renderJogo();
        }

        function cliqueEspaco(idx) {
            if (estadoJogo.bolaSelecionada !== null) {
                estadoJogo.slots[idx] = estadoJogo.bolaSelecionada;
                estadoJogo.bolaSelecionada = null;
                verificarResposta();
            }
        }

        function removerBola(idx) {
            estadoJogo.slots[idx] = null;
            renderJogo();
        }

        function verificarResposta() {
            renderJogo(); // Atualiza a tela primeiro com a bola no slot
            
            if (estadoJogo.slots.includes(null)) return;
            
            let calc = 0;
            let currentOp = '+';
            
            for(let item of estadoJogo.equacao.format) {
                if (item.type === 'number') {
                    if (currentOp === '+') calc += item.value;
                    else if (currentOp === '-') calc -= item.value;
                } else if (item.type === 'empty') {
                    let val = estadoJogo.slots[item.slotIndex];
                    if (currentOp === '+') calc += val;
                    else if (currentOp === '-') calc -= val;
                } else if (item.type === 'operator' && (item.value === '+' || item.value === '-')) {
                    currentOp = item.value;
                }
            }
            
            let feedback = document.getElementById('feedback');
            if (calc === estadoJogo.equacao.result) {
                feedback.textContent = "Correto! 🎉";
                feedback.style.color = "#4CAF50"; 
                estadoJogo.bolaSelecionada = null;
                setTimeout(() => avancarEquacao(), 1500);
            } else {
                feedback.textContent = "Incorreto. Tente novamente!";
                feedback.style.color = "#FFCCCC"; 
                setTimeout(() => {
                    feedback.textContent = "";
                }, 2000);
            }
        }

        function avancarEquacao() {
            estadoJogo.resolvidas++;
            document.getElementById('feedback').textContent = "";
            
            if (estadoJogo.resolvidas >= estadoJogo.configs.qtdPorNivel) {
                estadoJogo.nivel++;
                estadoJogo.resolvidas = 0;
                if (estadoJogo.nivel > 7) {
                    alert("Parabéns! Você concluiu todos os níveis!");
                    reiniciarJogo();
                    return;
                }
            }
            
            iniciarEquacao();
        }

        function iniciarTimer() {
            if (estadoJogo.intervalTimer) clearInterval(estadoJogo.intervalTimer);
            estadoJogo.timer = 0;
            
            if (estadoJogo.configs.timerAtivo) {
                document.getElementById('timerDisplay').classList.remove('hidden');
                document.getElementById('timerDisplay').textContent = "Tempo: 0s";
                estadoJogo.intervalTimer = setInterval(() => {
                    estadoJogo.timer++;
                    document.getElementById('timerDisplay').textContent = "Tempo: " + estadoJogo.timer + "s";
                }, 1000);
            } else {
                document.getElementById('timerDisplay').classList.add('hidden');
            }
        }

        function abrirConfigs() {
            document.getElementById('configQtd').value = estadoJogo.configs.qtdPorNivel;
            document.getElementById('configTimer').checked = estadoJogo.configs.timerAtivo;
            document.getElementById('configModal').style.display = 'flex';
        }

        function fecharConfigs() {
            document.getElementById('configModal').style.display = 'none';
        }

        function salvarConfigs() {
            estadoJogo.configs.timerAtivo = document.getElementById('configTimer').checked;
            let novaQtd = parseInt(document.getElementById('configQtd').value);
            if (!isNaN(novaQtd) && novaQtd > 0) {
                estadoJogo.configs.qtdPorNivel = novaQtd;
            }
            fecharConfigs();
            reiniciarJogo();
        }

        function reiniciarJogo() {
            estadoJogo.nivel = 1;
            estadoJogo.resolvidas = 0;
            document.getElementById('feedback').textContent = "";
            iniciarTimer();
            iniciarEquacao();
        }

        window.onload = () => {
            reiniciarJogo();
        };
    </script>
</body>
</html>
